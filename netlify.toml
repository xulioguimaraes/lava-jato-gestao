[build]
  command = "npm run build"
  publish = "build/client"

# A função do servidor é gerada automaticamente pelo @netlify/remix-adapter
# (Vite plugin). Não é mais necessário definir functions/redirects manualmente.

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
